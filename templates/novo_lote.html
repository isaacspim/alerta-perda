{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm p-4">
            <h2 class="h3 mb-1">Cadastrar lote</h2>
            <p class="text-muted">Produto: <strong>{{ produto.nome }}</strong></p>
            {% if erro %}<div class="alert alert-danger" role="alert">{{ erro }}</div>{% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label for="codigo_lote" class="form-label">Código do lote</label>
                    <input id="codigo_lote" type="text" name="codigo_lote" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="data_entrada" class="form-label">Data de entrada</label>
                        <input id="data_entrada" type="date" name="data_entrada" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="data_validade" class="form-label">Data de validade</label>
                        <input id="data_validade" type="date" name="data_validade" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="quantidade" class="form-label">Quantidade recebida ({{ produto.unidade_medida }})</label>
                        <input id="quantidade" type="number" min="0.01" step="0.01" name="quantidade" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="local_armazenamento" class="form-label">Local de armazenamento</label>
                        <input id="local_armazenamento" type="text" name="local_armazenamento" class="form-control" placeholder="Ex.: Câmara fria 1">
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <a href="{{ url_for('lotes_produto', produto_id=produto.id) }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar lote</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
